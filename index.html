
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102d46">
<title>الوسيط | AL WASEET</title>
<style>
:root{--navy:#102d46;--blue:#176b87;--teal:#10a6a0;--orange:#f3a34b;--light:#f3f7fa;--text:#24394d}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--light);color:var(--text)}
a{text-decoration:none;color:inherit}
header{background:white;position:sticky;top:0;z-index:20;box-shadow:0 3px 18px #102d4612}
.nav{max-width:1200px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:900;color:var(--blue)}
.logo span{color:var(--orange)}
nav{display:flex;gap:18px;flex-wrap:wrap}
nav a{font-size:14px;font-weight:bold}
nav a:hover{color:var(--teal)}
button,.btn{border:0;border-radius:9px;padding:12px 18px;background:var(--teal);color:white;font-weight:bold;cursor:pointer;display:inline-block}
button:hover,.btn:hover{filter:brightness(.94)}
.lang{background:var(--orange);color:#172f45}
.hero{background:linear-gradient(100deg,#102d46ed,#176b87c9),url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1800') center/cover;color:white;padding:90px 7%}
.hero-inner{max-width:1150px;margin:auto}
.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.35;max-width:750px;margin:0 0 18px}
.hero p{font-size:18px;line-height:2;max-width:700px;color:#e3f3f7}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}
.btn.secondary{background:white;color:var(--navy)}
.wrap{max-width:1200px;margin:auto;padding:55px 22px}
.heading{text-align:center;margin-bottom:32px}
.heading h2{font-size:30px;color:var(--navy);margin:0 0 10px}
.heading p{color:#728397;line-height:1.8}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:22px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 8px 26px #173a5510;transition:.2s}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 30px #173a5520}
.card img{width:100%;height:175px;object-fit:cover;display:block}
.card-body{padding:21px}
.card h3{margin:0 0 10px;color:var(--blue);font-size:21px}
.card p{color:#718195;line-height:1.8;min-height:55px;font-size:14px}
.card .btn{margin-top:8px}
.stats{background:#e7f4f5}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px;text-align:center}
.stat{background:white;padding:24px;border-radius:14px}
.stat strong{font-size:27px;color:var(--teal);display:block;margin-bottom:8px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.step{background:white;padding:25px;border-radius:14px;text-align:center}
.step b{font-size:30px;color:var(--orange)}
.page-hero{padding:55px 7%;background:linear-gradient(100deg,#102d46ed,#176b87d9),url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1500') center/cover;color:white}
.page-hero h1{font-size:36px;margin:0 0 12px}
.page-hero p{line-height:1.9;max-width:750px}
.page-tools{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}
.page-tools input,.page-tools select{padding:13px;border:1px solid #d6e0e8;border-radius:9px;background:white;min-width:180px;flex:1;font:inherit}
.notice{padding:22px;background:#fff8e9;border:1px solid #f5d9a8;border-radius:12px;line-height:1.9;color:#72501f}
.back{display:inline-block;margin-bottom:18px;color:#d8f7f5;font-weight:bold}
footer{background:#102d46;color:#dbe8ef;text-align:center;padding:30px 18px;line-height:2}
footer strong{color:#f3a34b}
.hidden{display:none!important}
@media(max-width:650px){.nav{justify-content:center}.hero{padding:65px 22px}nav{justify-content:center;gap:12px}.page-hero h1{font-size:29px}}
</style>
</head>
<body>
<header>
<div class="nav">
<a class="logo" href="#/">الوسيط <span>| AL WASEET</span></a>
<nav>
<a href="#/">الرئيسية</a>
<a href="#/contracting">المقاولات</a>
<a href="#/realestate">العقارات</a>
<a href="#/supplies">التوريدات</a>
<a href="#/investment">الاستثمار</a>
</nav>
<button class="lang" onclick="toggleLanguage()">English</button>
</div>
</header>

<main id="app"></main>

<footer>
<strong>الوسيط | AL WASEET</strong><br>
منصة تجمع الفرص وأصحاب الأعمال في مكان واحد<br>
© 2026 AL WASEET – جميع الحقوق محفوظة
</footer>

<script>
let english=false;

const sections={
contracting:{
ar:"المقاولات والتشطيبات",
en:"Contracting & Finishing",
descAr:"فرص تنفيذ الأعمال والمقاولات والتشطيبات لجميع التخصصات والأحجام.",
descEn:"Construction, contracting and finishing opportunities across all specialties.",
image:"https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=1200",
itemsAr:["أعمال الخرسانة والإنشاءات","المحارة واللياسة","السيراميك والرخام","الدهانات والتشطيبات","الهدم والإزالة","أعمال الكهرباء والسباكة","الأعمال المعدنية والألومنيوم","أعمال الطرق والبنية التحتية"],
itemsEn:["Concrete & Construction","Plastering","Ceramic & Marble","Painting & Finishing","Demolition & Removal","Electrical & Plumbing","Metal & Aluminum Works","Roads & Infrastructure"]
},
realestate:{
ar:"العقارات والأراضي",
en:"Real Estate & Land",
descAr:"مساحة لعرض وتسويق العقارات والوحدات السكنية والتجارية والأراضي.",
descEn:"A place to discover residential, commercial and land opportunities.",
image:"https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1200",
itemsAr:["شقق سكنية","فيلات وقصور","أراضٍ سكنية","أراضٍ تجارية","محلات ومكاتب","عقارات للبيع","عقارات للإيجار"],
itemsEn:["Apartments","Villas","Residential Land","Commercial Land","Shops & Offices","Properties for Sale","Properties for Rent"]
},
supplies:{
ar:"التوريدات والمستلزمات",
en:"Supplies & Materials",
descAr:"فرص توريد مواد البناء والمعدات والخامات والمستلزمات للمشروعات.",
descEn:"Supply opportunities for building materials, equipment and project needs.",
image:"https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=1200",
itemsAr:["مواد البناء","حديد وأسمنت","معدات وآلات","كابلات ومستلزمات كهرباء","أدوات صحية","خامات التشطيب","توريدات عامة"],
itemsEn:["Building Materials","Steel & Cement","Equipment & Machinery","Cables & Electrical Supplies","Sanitary Supplies","Finishing Materials","General Supplies"]
},
investment:{
ar:"الفرص الاستثمارية",
en:"Investment Opportunities",
descAr:"التعريف بالمشروعات والفرص الاستثمارية والشراكات التجارية.",
descEn:"Discover projects, investment opportunities and business partnerships.",
image:"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1200",
itemsAr:["فرص استثمار عقاري","شراكات تجارية","مشروعات جديدة","فرص توسع ونمو","استثمارات متنوعة"],
itemsEn:["Real Estate Investment","Business Partnerships","New Projects","Growth Opportunities","Other Investments"]
}
};

function home(){
return `
<section class="hero"><div class="hero-inner">
<h1>${english?"The right opportunity starts here":"فرصتك تبدأ من المكان الصحيح"}</h1>
<p>${english?"A platform connecting project owners, contractors, suppliers and real estate opportunities in one place.":"منصة الوسيط تجمع أصحاب المشروعات والمقاولين والموردين والباحثين عن العقارات في مكان واحد، لتسهيل الوصول إلى الفرص المناسبة."}</p>
<div class="hero-actions">
<a class="btn" href="#/contracting">${english?"Explore Opportunities":"اكتشف الفرص"}</a>
<a class="btn secondary" href="#/realestate">${english?"Explore Real Estate":"تصفح العقارات"}</a>
</div></div></section>

<section class="wrap">
<div class="heading"><h2>${english?"Explore Our Sections":"اكتشف أقسام الوسيط"}</h2><p>${english?"Different opportunities, one destination":"كل المجالات والفرص في منصة واحدة"}</p></div>
<div class="cards">
${Object.keys(sections).map(k=>`
<article class="card">
<img src="${sections[k].image}" alt="">
<div class="card-body">
<h3>${english?sections[k].en:sections[k].ar}</h3>
<p>${english?sections[k].descEn:sections[k].descAr}</p>
<a class="btn" href="#/${k}">${english?"Open Section":"دخول القسم"}</a>
</div></article>`).join("")}
</div></section>

<section class="stats"><div class="wrap">
<div class="heading"><h2>${english?"A platform for business":"منصة واحدة لأعمال متعددة"}</h2><p>${english?"A clear path to connect and cooperate":"مساحة منظمة لعرض الفرص والوصول إلى الشركاء"}</p></div>
<div class="stat-grid">
<div class="stat"><strong>01</strong>${english?"Contracting":"المقاولات"}</div>
<div class="stat"><strong>02</strong>${english?"Real Estate":"العقارات"}</div>
<div class="stat"><strong>03</strong>${english?"Supplies":"التوريدات"}</div>
<div class="stat"><strong>04</strong>${english?"Investment":"الاستثمار"}</div>
</div></div></section>

<section class="wrap">
<div class="heading"><h2>${english?"How It Works":"كيف يعمل الوسيط؟"}</h2><p>${english?"Simple steps to find the right opportunity":"خطوات واضحة للوصول إلى الفرصة المناسبة"}</p></div>
<div class="steps">
<div class="step"><b>01</b><h3>${english?"Choose a Section":"اختر القسم"}</h3><p>${english?"Browse the field you need":"حدد المجال الذي تبحث فيه"}</p></div>
<div class="step"><b>02</b><h3>${english?"Review Opportunities":"تصفح الفرص"}</h3><p>${english?"Explore categories and details":"استعرض التصنيفات والتفاصيل"}</p></div>
<div class="step"><b>03</b><h3>${english?"Connect & Cooperate":"تواصل وتعاون"}</h3><p>${english?"Move toward a business opportunity":"ابدأ طريق التعاون والعمل"}</p></div>
</div></section>`;
}

function sectionPage(key){
const s=sections[key];
if(!s)return home();
let items=english?s.itemsEn:s.itemsAr;
return `
<section class="page-hero">
<a class="back" href="#/">← ${english?"Back to Home":"العودة إلى الرئيسية"}</a>
<h1>${english?s.en:s.ar}</h1>
<p>${english?s.descEn:s.descAr}</p>
</section>
<section class="wrap">
<div class="heading"><h2>${english?"Browse Categories":"تصفح التصنيفات"}</h2><p>${english?"Choose a category to explore":"اختر التخصص الذي تبحث عنه"}</p></div>
<div class="page-tools">
<input id="searchBox" type="search" placeholder="${english?"Search categories...":"ابحث داخل التصنيفات..."}" oninput="filterItems()">
</div>
<div class="cards" id="categoryCards">
${items.map((item,i)=>`
<article class="card category-card">
<div class="card-body">
<h3>${item}</h3>
<p>${english?"Explore this category and discover related opportunities.":"استكشف هذا التخصص وتابع الفرص المرتبطة به."}</p>
<a class="btn" href="#/contact">${english?"Ask about this category":"استفسر عن هذا التخصص"}</a>
</div></article>`).join("")}
</div>
<div class="notice" style="margin-top:28px">
<strong>${english?"Important note":"تنويه مهم"}</strong><br>
${english?"Opportunity listings and account features will be activated after connecting a database and administration system.":"عرض الفرص واستقبال طلبات العملاء وإنشاء الحسابات يحتاج إلى ربط قاعدة بيانات ونظام إدارة. هذه النسخة هي الواجهة الأساسية للموقع."}
</div>
</section>`;
}

function contactPage(){
return `<section class="page-hero"><a class="back" href="#/">← ${english?"Back to Home":"العودة إلى الرئيسية"}</a><h1>${english?"Contact & Inquiries":"التواصل والاستفسارات"}</h1><p>${english?"Thank you for your interest in Al Waseet.":"شكرًا لاهتمامك بمنصة الوسيط."}</p></section>
<section class="wrap"><div class="notice">${english?"Contact channels and inquiry forms will be added when the platform's official contact details are configured.":"سيتم إضافة وسائل التواصل ونموذج الاستفسارات بعد تحديد بيانات التواصل الرسمية للمنصة."}</div></section>`;
}

function render(){
let route=location.hash.replace("#/","").split("?")[0];
let app=document.getElementById("app");
if(!route)app.innerHTML=home();
else if(sections[route])app.innerHTML=sectionPage(route);
else if(route==="contact")app.innerHTML=contactPage();
else app.innerHTML=home();
document.documentElement.lang=english?"en":"ar";
document.documentElement.dir=english?"ltr":"rtl";
window.scrollTo(0,0);
}

function filterItems(){
let q=document.getElementById("searchBox").value.toLowerCase();
document.querySelectorAll(".category-card").forEach(card=>{
card.classList.toggle("hidden",!card.innerText.toLowerCase().includes(q));
});
}

function toggleLanguage(){
english=!english;
document.querySelector(".lang").textContent=english?"العربية":"English";
render();
}

window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
